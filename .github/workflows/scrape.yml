name: Scrape

on:
  schedule:
    # Three runs a day so listings a venue posts during the day reach the site
    # within hours, not the next morning. Times are UTC, so Pacific shifts an
    # hour with DST:  02:37 → 6:37pm PST / 7:37pm PDT
    #                 12:37 → 4:37am PST / 5:37am PDT
    #                 20:37 → 12:37pm PST / 1:37pm PDT
    # Off the top of the hour on purpose: GitHub's scheduler is most congested
    # at :00, and our old "0 12" run routinely started 3–6 hours late.
    # The pi-scraper host's residential scrape (OMSI/Hollywood → pi-data branch) runs at
    # 4:15/12:15/18:15 local, ahead of each of these in both PST and PDT.
    # Ordering only affects freshness: pi-source.ts takes the pi-scraper host's latest push
    # up to 36h old either way.
    - cron: "37 2,12,20 * * *"
  workflow_dispatch: # allow manual trigger from Actions tab

permissions:
  contents: write

# Serialize with the UI release so the two never push gh-pages at once.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  scrape:
    # ubuntu-latest is 26.04 since Oct 2026; Playwright supports it from 1.61.
    # (Pinned to 24.04 while we were on 1.60, whose installer rejected 26.04.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest main, not the commit that triggered the run. A run queued
          # behind another (concurrency group) otherwise checks out a SHA from
          # before that run's data commit, regenerates the same files from a
          # stale base, and conflicts on push (happened 2026-11-04 20:04Z).
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        # Browser binary comes from the cache above. --with-deps apt-installs
        # Chromium's system libraries (~12s). The 24.04 image shipped them so
        # we used to skip it; kept on for 26.04 until a run proves it's not
        # needed there.
        run: npx playwright install --with-deps chromium

      - name: Scrape
        run: npm run scrape
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          # Per-venue health alerts (src/health.ts) push here. NTFY_TOPIC is a
          # secret because anyone who knows an ntfy.sh topic can read it.
          # NTFY_SERVER is optional (defaults to https://ntfy.sh).
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # venue-health.json is the rolling per-venue history that decides
          # whether an empty week is unusual; it must persist between runs.
          # feed-state.json records when each film first appeared (for RSS).
          # The feeds themselves (public/feeds/) only go to gh-pages, below.
          git add public/data/showtimes.json state/venue-health.json state/feed-state.json
          if git diff --staged --quiet; then
            echo "No changes — skipping commit"
          else
            if [ "${{ github.event_name }}" = "schedule" ]; then
              KIND="scheduled"
            else
              KIND="manual"
            fi
            # Several runs a day now, so include the time to tell them apart.
            git commit -m "chore: ${KIND} scrape $(date -u +%Y-%m-%dT%H:%MZ)"
            # If another writer landed generated files in the meantime, this
            # run's copies win: they're whole files built from a scrape that
            # just finished, so a line-level merge of two JSON snapshots would
            # only produce a mix of both. Any other conflict still fails loudly.
            GENERATED="public/data/showtimes.json state/venue-health.json state/feed-state.json"
            if ! git pull --rebase origin main; then
              conflicted=$(git diff --name-only --diff-filter=U)
              for f in $conflicted; do
                case " $GENERATED " in
                  *" $f "*) ;;
                  *) echo "Conflict in non-generated file $f — giving up."; git rebase --abort; exit 1 ;;
                esac
              done
              echo "Conflict in generated files ($conflicted) — keeping this run's versions."
              # During a rebase, "theirs" is the commit being replayed: this run's.
              git checkout --theirs -- $conflicted
              git add $conflicted
              GIT_EDITOR=true git rebase --continue
            fi
            git push --no-verify
          fi

      # Deploy ONLY the data file to the live site. This touches data/showtimes.json
      # on gh-pages and nothing else, so the scheduled scrape never ships UI changes —
      # those go out solely via the manual Deploy UI workflow.
      - name: Deploy data to gh-pages
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages does not exist yet — run the Deploy UI workflow once to create it. Skipping data deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add -B gh-pages gh-pages-wt origin/gh-pages

          mkdir -p gh-pages-wt/data
          cp public/data/showtimes.json gh-pages-wt/data/showtimes.json

          # Calendar/RSS feeds: replace the whole dir so a venue that drops out
          # of the registry loses its .ics too. Not committed to main (~1MB per
          # run of mostly repeated text); deploy.yml leaves this dir in place.
          rm -rf gh-pages-wt/feeds
          cp -r public/feeds gh-pages-wt/feeds

          git -C gh-pages-wt add data/showtimes.json feeds
          if git -C gh-pages-wt diff --staged --quiet; then
            echo "Live data already current — nothing to deploy."
          else
            git -C gh-pages-wt commit -m "data: scrape $(date -u +%Y-%m-%dT%H:%MZ)"
            git -C gh-pages-wt push origin gh-pages
          fi

      # Whole-run failure (crash, every scraper down, commit/deploy error): the
      # per-venue health check in scrape.ts never got to run or report, so push
      # directly, at urgent (5) priority: nothing on the site is updating.
      # (Per-venue tiers in health.ts: failing 4, empty 3, recovered 2.)
      # GitHub's own failure email still goes out too.
      - name: Push alert on failed run
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then echo "NTFY_TOPIC not set — skipping"; exit 0; fi
          # Exact Pacific time up front: the ntfy app only shows "yesterday"-style
          # relative times. Same format as health.ts, e.g. "Wed, Nov 4, 10:42 AM PST".
          STAMP="$(TZ=America/Los_Angeles date '+%a, %b %-d, %-I:%M %p %Z')"
          curl -sS --max-time 15 \
            -H "Title: small screens URGENT: scrape run FAILED" \
            -H "Priority: 5" \
            -H "Tags: skull,film_projector" \
            -H "Click: ${RUN_URL}" \
            -d "${STAMP}
          The scheduled scrape job failed outright, so no venues were updated. Tap for the run log." \
            "${NTFY_SERVER:-https://ntfy.sh}/${NTFY_TOPIC}"
